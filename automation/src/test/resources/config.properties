# AMS database (from Database.md), used to check the Recruitment Funnel counts
db.url=jdbc:mysql://192.168.2.80:3306/AMSQADB
db.user=amsuser
db.password=Admin@123

# Browser settings
headless=false
timeout.seconds=25

# Tester name written to the execution result file (leave blank if not configured)
tester=Aishwarya

# Workbooks (relative to the automation folder), both in the QA_Testcase_Template_V1 format
input.workbook.uat=../Test_Cases_UAT_Sept_2026_QA_Template.xlsx
input.workbook.scenario=../Test_Cases_UAT_Sept_2026_Based on Test Scenario_QA_Template.xlsx

# Test cases executed by "mvn test": those whose Priority (calculated in the workbook from
# Impact x Likelihood) is chosen. "mvn clean test" asks which priority to execute (P1, P2, P3, P4,
# several e.g. P1,P2, or all); pressing Enter (or running without a keyboard, e.g. in CI) uses the
# value below. Skip the question with -Dpriorities=P1 or -Dpriorities=all.
# -Dtestcases=TC_001,TC_005 runs exactly those test cases, whatever their priority.
priorities=all

# When "mvn clean test" starts, all earlier report files in this folder (and old failure screenshots)
# are deleted and a fresh result file is created here (QA template format: QA Dashboard + Test Cases).
# It is saved again after every test case.
# A live status page (testcases_result.html) opens in the browser at the start; it refreshes every
# 5 seconds and shows each result as soon as the test case has been executed. The .xlsx is saved after
# every test case and opens when the execution has finished (Linux: WPS; Windows / macOS: the program
# .xlsx files are associated with, e.g. Excel).
# open.report=false: only save the files, do not open them.
execution.reports.folder=../Execution_Reports

# Project / Release shown on the QA Dashboard of the result file
report.project=Agent Onboarding & Recruitment Support - UAT Sept 2026 (Automation)
result.file.name=testcases_result.xlsx

# When a test case is blocked, the execution pauses and a pop-up asks the tester to confirm:
# "Keep Blocked", "Mark as Pass" or "Mark as Fail" (the reason, which can be edited, goes to Remarks for Fail).
# The execution resumes where it paused after the answer. Failed test cases are never asked (recorded as Fail).
# Never asked in headless runs. confirm.failures=false: blocked test cases stay Blocked without asking.
confirm.failures=false
open.report=true
